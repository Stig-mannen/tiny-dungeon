<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiny Dungeon: Endless Depths</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>TINY DUNGEON</h1>
    <p>ENDLESS DEPTHS · Explore, fight, collect and survive</p>
  </header>
  <main>
    <div class="game-shell">
      <canvas id="game" width="960" height="600" aria-label="Tiny Dungeon spel"></canvas>
    </div>
    <div class="help">
      <span><b>WASD / piltangenter</b> Rörelse</span>
      <span><b>SPACE</b> Attack</span>
      <span><b>E</b> Öppna kista / använd portal</span>
      <span><b>B</b> Shop</span>
      <span><b>J</b> Bestiarium</span>
      <span><b>ESC</b> Stäng meny</span>
    </div>
    <p class="note">Tips: Utforska dörrarna i alla riktningar. Bossrum har en gyllene markering!</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
